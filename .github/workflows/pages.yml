name: pages

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# A reusable workflow runs with the caller's token permissions, so these must be
# granted here — the callee cannot widen them.
permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write

jobs:
  pages:
    uses: kuboon/workflows/.github/workflows/github-page-with-preview.yaml@main
    with:
      # Self-contained: the reusable workflow rebuilds `main` on every run, so the
      # command must not depend on repo files that only exist on the PR branch.
      # mise provides node; the build reads BASE_URL to set the asset base path.
      build-command: mise exec node@24 -- bash -c "npm ci && npm run typecheck && npm test && npm run build"
      dist-dir: build
