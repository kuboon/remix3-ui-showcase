name: pages

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# A reusable workflow runs with the caller's token permissions, so these must be
# granted here — the callee cannot widen them.
permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write

jobs:
  pages:
    uses: kuboon/workflows/.github/workflows/github-page-with-preview.yaml@main
    with:
      # The build reads BASE_URL (injected by the reusable workflow) to set the
      # asset base path; the mise task installs deps, typechecks, tests, and builds.
      build-command: mise install && mise run build
      dist-dir: build
